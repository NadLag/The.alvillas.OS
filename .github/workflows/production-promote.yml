name: Promote Production

on:
  workflow_dispatch:
    inputs:
      owner_approval_reference:
        description: "Owner approval/ticket reference for production promotion"
        required: true
        type: string

permissions:
  contents: read

jobs:
  disabled:
    if: ${{ vars.PRODUCTION_PROMOTION_ENABLED != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Production promotion is disabled. Set PRODUCTION_PROMOTION_ENABLED=true only after owner approval."

  promote:
    if: ${{ vars.PRODUCTION_PROMOTION_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_CLI_VERSION: "63.1.2"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Vercel CLI
        run: npm install -g "vercel@${VERCEL_CLI_VERSION:?set VERCEL_CLI_VERSION}"
      - name: Pull production environment
        run: vercel pull --yes --environment=production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Build production
        run: vercel build --prod
      - name: Stage production deployment
        id: stage
        run: |
          deployment_url="$(vercel deploy --prebuilt --prod --skip-domain)"
          DEPLOYMENT_URL="$deployment_url" node --input-type=module -e '
            const value = process.env.DEPLOYMENT_URL;
            const url = new URL(value);
            if (url.protocol !== "https:" || url.origin !== value || !url.hostname.endsWith(".vercel.app")) {
              throw new Error("Vercel deploy did not return an https://*.vercel.app origin");
            }
          '
          printf 'url=%s\n' "$deployment_url" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Promote approved deployment
        run: vercel promote "$DEPLOYMENT_URL"
        env:
          DEPLOYMENT_URL: ${{ steps.stage.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
