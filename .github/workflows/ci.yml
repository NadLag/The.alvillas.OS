name: CI

on:
  pull_request:
  push:
    branches: [main]

# Only a superseded PR can cancel its earlier verification. Every main run is unique.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/alvillas_os?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/alvillas_os?schema=public
      POSTGRES_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres?schema=public
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/alvillas_os_shadow?schema=public
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Record exact verification source
        run: node scripts/ci/record-verification.mjs start
      - run: npm audit --audit-level=high
      - run: npm run lint
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - run: npm run typecheck
      - run: npm run check:i18n
      - run: npm run check:rtl-css
      - run: npm run check:design-system
      - run: npm run check:boundaries
      - run: npm run check:organization-id
      - run: npm run check:ledger
      - run: npm run check:audit
      - run: npm run check:progress
      - name: Record verification outcome
        if: always()
        run: node scripts/ci/record-verification.mjs end
        env:
          CI_GATE_STATUS: ${{ job.status }}
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-evidence/
          if-no-files-found: ignore
          retention-days: 7

  unit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/alvillas_os?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/alvillas_os?schema=public
      POSTGRES_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres?schema=public
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/alvillas_os_shadow?schema=public
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Record exact verification source
        run: node scripts/ci/record-verification.mjs start
      - run: npm run test:unit -- --reporter=default --reporter=json --outputFile=ci-evidence/unit.json
      - name: Record verification outcome
        if: always()
        run: node scripts/ci/record-verification.mjs end
        env:
          CI_GATE_STATUS: ${{ job.status }}
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-evidence/
          if-no-files-found: ignore
          retention-days: 7

  postgres:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: alvillas_os
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d alvillas_os"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/alvillas_os?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/alvillas_os?schema=public
      POSTGRES_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres?schema=public
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/alvillas_os_shadow?schema=public
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Record exact verification source
        run: node scripts/ci/record-verification.mjs start
      - name: Prepare schema drift database
        run: |
          echo "CREATE DATABASE alvillas_os_shadow;" | npx prisma db execute --stdin --url "$POSTGRES_ADMIN_URL"
      - run: npm run check:schema-drift
      - name: Prepare isolated integration database
        run: npx prisma migrate deploy
      - run: npm run test:integration -- --reporter=default --reporter=json --outputFile=ci-evidence/postgres.json
      - name: Record verification outcome
        if: always()
        run: node scripts/ci/record-verification.mjs end
        env:
          CI_GATE_STATUS: ${{ job.status }}
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-evidence/
          if-no-files-found: ignore
          retention-days: 7

  restore-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: alvillas_os
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d alvillas_os"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/alvillas_os?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/alvillas_os?schema=public
      POSTGRES_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres?schema=public
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/alvillas_os_shadow?schema=public
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Record exact verification source
        run: node scripts/ci/record-verification.mjs start
      - name: Prepare independent build database
        run: npx prisma migrate deploy
      - run: npm run rehearse:restore
      - run: npm run build
        env:
          ALVILLAS_CI_BUILD_TYPECHECK: application
      - name: Record verification outcome
        if: always()
        run: node scripts/ci/record-verification.mjs end
        env:
          CI_GATE_STATUS: ${{ job.status }}
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-evidence/
          if-no-files-found: ignore
          retention-days: 7

  playwright:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, field-mobile]
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: alvillas_os
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d alvillas_os"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CI_BROWSER_PROJECT: ${{ matrix.project }}
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/alvillas_os?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/alvillas_os?schema=public
      POSTGRES_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres?schema=public
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/alvillas_os_shadow?schema=public
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Record exact verification source
        run: node scripts/ci/record-verification.mjs start
      - name: Prepare isolated browser database
        run: npx prisma migrate deploy
      - run: npm run build
        env:
          ALVILLAS_CI_BUILD_TYPECHECK: application
      - run: npx playwright install --with-deps chromium
      - name: Configure isolated browser push signing
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from "node:fs";
          import webpush from "web-push";
          import { randomBytes } from "node:crypto";
          const keys = webpush.generateVAPIDKeys();
          appendFileSync(process.env.GITHUB_ENV, [
            `VAPID_PUBLIC_KEY=${keys.publicKey}`,
            `VAPID_PRIVATE_KEY=${keys.privateKey}`,
            "VAPID_SUBJECT=mailto:notifications@example.test",
            `INNGEST_SIGNING_KEY=signkey-test-${randomBytes(32).toString("hex")}`,
            `RESEND_WEBHOOK_SECRET=whsec_${randomBytes(32).toString("base64")}`,
            `AUTH_SECRET=${randomBytes(32).toString("hex")}`,
            `ENCRYPTION_KEYS=ci:${randomBytes(32).toString("base64")}`,
            ""
          ].join("\n"));
          NODE
      - name: Discover every original browser project case
        run: node node_modules/playwright/cli.js test --list --retries=0 --config playwright.ci.config.ts --project '${{ matrix.project }}' --reporter=json > ci-evidence/playwright-expected.json
        env:
          PLAYWRIGHT_PRODUCTION: "1"
          NODE_ENV: production
          AUTH_TRUST_HOST: "true"
          APP_URL: http://localhost:3000
      - run: npm run test:e2e -- --retries=0 --config playwright.ci.config.ts --project '${{ matrix.project }}'
        env:
          PLAYWRIGHT_PRODUCTION: "1"
          NODE_ENV: production
          AUTH_TRUST_HOST: "true"
          APP_URL: http://localhost:3000
      - name: Retain failed or superseded browser evidence
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-${{ matrix.project }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Record verification outcome
        if: always()
        run: node scripts/ci/record-verification.mjs end
        env:
          CI_GATE_STATUS: ${{ job.status }}
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ github.job }}-${{ matrix.project }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-evidence/
          if-no-files-found: ignore
          retention-days: 7

  checks:
    if: always()
    needs: [static, unit, postgres, restore-build, playwright]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node scripts/ci/record-verification.mjs start
      - name: Require every mandatory verification job
        env:
          MANDATORY_RESULTS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'NODE'
          const jobs = JSON.parse(process.env.MANDATORY_RESULTS);
          const expected = ["static", "unit", "postgres", "restore-build", "playwright"];
          if (Object.keys(jobs).length !== expected.length || expected.some(name => jobs[name]?.result !== "success")) {
            console.error(JSON.stringify(Object.fromEntries(expected.map(name => [name, jobs[name]?.result ?? "missing"]))));
            process.exit(1);
          }
          console.log("All five mandatory jobs passed for this exact source head.");
          NODE
      - name: Read both original browser project reports
        uses: actions/download-artifact@v4
        with:
          pattern: verification-playwright-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-browser-evidence/
          merge-multiple: false
      - name: Require complete original browser coverage
        run: node scripts/ci/check-browser-coverage.mjs
      - name: Read all original compiler and production build evidence
        uses: actions/download-artifact@v4
        with:
          pattern: verification-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-typecheck-evidence/
          merge-multiple: false
      - name: Require complete original compiler coverage
        run: node scripts/ci/check-typecheck-coverage.mjs
      - name: Record verification outcome
        if: always()
        run: node scripts/ci/record-verification.mjs end
        env:
          CI_GATE_STATUS: ${{ job.status }}
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-evidence/
          if-no-files-found: ignore
          retention-days: 7

  deploy-staging:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.STAGING_DEPLOYMENTS_PAUSED != 'true'
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: staging-deployment
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_CLI_VERSION: "63.1.2"
      STAGING_ALIAS: "the-alvillas-os-staging.vercel.app"
      STAGING_DATABASE_IDENTITY: ${{ vars.STAGING_DATABASE_IDENTITY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Detect staging credential readiness
        id: staging_credentials
        run: |
          missing=""
          for name in VERCEL_ORG_ID VERCEL_PROJECT_ID VERCEL_TOKEN STAGING_MIGRATION_DATABASE_URL STAGING_DATABASE_IDENTITY; do
            value="${!name:-}"
            if [ -z "$value" ]; then
              missing="${missing}${missing:+, }${name}"
            fi
          done

          if [ -n "$missing" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Staging deployment blocked"
              echo
              echo "Missing GitHub staging credential(s): \`$missing\`."
              echo
              echo "Configure the named credentials in the GitHub staging environment."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "Staging credential presence ok." >> "$GITHUB_STEP_SUMMARY"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          STAGING_MIGRATION_DATABASE_URL: ${{ secrets.STAGING_MIGRATION_DATABASE_URL }}
      - name: Require current merged main
        if: steps.staging_credentials.outputs.ready == 'true'
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$GITHUB_SHA"
        env:
          GH_TOKEN: ${{ github.token }}
      - if: steps.staging_credentials.outputs.ready == 'true'
        run: npm ci
      - name: Validate staging credentials
        if: steps.staging_credentials.outputs.ready == 'true'
        run: |
          test -n "${VERCEL_ORG_ID:?GitHub staging variable VERCEL_ORG_ID is required}"
          test -n "${VERCEL_PROJECT_ID:?GitHub staging variable VERCEL_PROJECT_ID is required}"
          test -n "${VERCEL_TOKEN:?GitHub staging secret VERCEL_TOKEN is required}"
          echo "staging credential presence ok"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Verify Vercel user, team and project access
        if: steps.staging_credentials.outputs.ready == 'true'
        run: npx tsx scripts/staging-vercel-access.ts
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Install Vercel CLI
        if: steps.staging_credentials.outputs.ready == 'true'
        run: npm install -g "vercel@${VERCEL_CLI_VERSION:?set VERCEL_CLI_VERSION}"
      - name: Pull staging environment
        if: steps.staging_credentials.outputs.ready == 'true'
        run: vercel pull --yes --environment=preview --scope "$VERCEL_ORG_ID"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Apply verified preview migrations
        if: steps.staging_credentials.outputs.ready == 'true'
        run: npx tsx scripts/staging-migrate.ts
        env:
          STAGING_MIGRATION_DATABASE_URL: ${{ secrets.STAGING_MIGRATION_DATABASE_URL }}
          STAGING_DATABASE_IDENTITY: ${{ vars.STAGING_DATABASE_IDENTITY }}
      - name: Deploy staging
        if: steps.staging_credentials.outputs.ready == 'true'
        id: deploy
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          deployment_output="$(vercel deploy --yes --target=preview --scope "$VERCEL_ORG_ID" --build-env "VERCEL_GIT_COMMIT_SHA=$GITHUB_SHA" --build-env VERCEL_GIT_COMMIT_REF=main --meta githubCommitSha="$GITHUB_SHA" --meta githubCommitRef=main --env "VERCEL_GIT_COMMIT_SHA=$GITHUB_SHA" --env VERCEL_GIT_COMMIT_REF=main)"
          deployment_url="$(DEPLOYMENT_OUTPUT="$deployment_output" node --input-type=module -e '
            const output = process.env.DEPLOYMENT_OUTPUT ?? "";
            const urls = [...output.matchAll(/https:\/\/[a-z0-9.-]+\.vercel\.app/g)].map((match) => match[0]);
            const deployment = urls.at(-1);
            if (!deployment) throw new Error("Vercel deploy did not print a deployment URL");
            console.log(deployment);
          ')"
          DEPLOYMENT_URL="$deployment_url" node --input-type=module -e '
            const value = process.env.DEPLOYMENT_URL;
            const url = new URL(value);
            if (url.protocol !== "https:" || url.origin !== value || !url.hostname.endsWith(".vercel.app")) {
              throw new Error("Vercel deploy did not return an https://*.vercel.app origin");
            }
          '
          printf 'url=%s\n' "$deployment_url" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Smoke staging deployment
        if: steps.staging_credentials.outputs.ready == 'true'
        run: |
          vercel curl --scope "$VERCEL_ORG_ID" /api/health --deployment "$DEPLOYMENT_URL" -- --fail --show-error --silent > /tmp/health.json
          vercel curl --scope "$VERCEL_ORG_ID" /api/readiness --deployment "$DEPLOYMENT_URL" -- --fail --show-error --silent > /tmp/readiness.json
          vercel curl --scope "$VERCEL_ORG_ID" /api/version --deployment "$DEPLOYMENT_URL" -- --fail --show-error --silent > /tmp/version.json
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const health = JSON.parse(readFileSync("/tmp/health.json", "utf8"));
            const readiness = JSON.parse(readFileSync("/tmp/readiness.json", "utf8"));
            const version = JSON.parse(readFileSync("/tmp/version.json", "utf8"));
            if (health.service !== "alvillas-os") throw new Error("Unexpected health payload");
            if (!["ready", "not_ready"].includes(readiness.status)) throw new Error("Unexpected readiness status");
            if (version.service !== "alvillas-os" || !version.version) throw new Error("Unexpected version payload");
            if (version.version !== process.env.GITHUB_SHA) throw new Error(`Unexpected version SHA ${version.version}`);
            if (version.environment !== "preview") throw new Error("Unexpected deployment environment");
            if (version.commitRef !== "main") throw new Error(`Unexpected commit ref ${version.commitRef}`);
            console.log(JSON.stringify({
              deployment: process.env.DEPLOYMENT_URL,
              health: health.status,
              readiness: readiness.status,
              version: version.version,
              checks: readiness.checks?.map((check) => `${check.name}:${check.status}`).join(",")
            }));
          '
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Assign stable staging alias
        if: steps.staging_credentials.outputs.ready == 'true'
        run: |
          test -n "${STAGING_ALIAS:?STAGING_ALIAS is required}"
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$GITHUB_SHA"
          vercel alias set "$DEPLOYMENT_URL" "$STAGING_ALIAS" --scope "$VERCEL_ORG_ID"
          # Alias propagation can briefly serve the previous deployment. Keep the
          # exact-commit assertion and wait only for that verified Preview SHA.
          for attempt in {1..12}; do
            vercel curl --scope "$VERCEL_ORG_ID" "/api/version?verify=${GITHUB_SHA}-${attempt}" --deployment "https://${STAGING_ALIAS}" -- --fail --show-error --silent -H 'Cache-Control: no-cache' > /tmp/staging-version.json
            if node --input-type=module -e '
              import { readFileSync } from "node:fs";
              const version = JSON.parse(readFileSync("/tmp/staging-version.json", "utf8"));
              process.exit(version.service === "alvillas-os" && version.environment === "preview" && version.commitRef === "main" && version.version === process.env.GITHUB_SHA ? 0 : 1);
            '; then break; fi
            if [ "$attempt" = 12 ]; then echo "Stable staging alias did not converge to the verified commit"; exit 1; fi
            sleep 5
          done
          vercel curl --scope "$VERCEL_ORG_ID" /api/health --deployment "https://${STAGING_ALIAS}" -- --fail --show-error --silent > /tmp/staging-health.json
          vercel curl --scope "$VERCEL_ORG_ID" /api/readiness --deployment "https://${STAGING_ALIAS}" -- --fail --show-error --silent > /tmp/staging-readiness.json
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const health = JSON.parse(readFileSync("/tmp/staging-health.json", "utf8"));
            const readiness = JSON.parse(readFileSync("/tmp/staging-readiness.json", "utf8"));
            const version = JSON.parse(readFileSync("/tmp/staging-version.json", "utf8"));
            if (health.service !== "alvillas-os" || readiness.status !== "ready") throw new Error("Stable staging health or readiness failed");
            if (version.service !== "alvillas-os" || version.environment !== "preview" || version.commitRef !== "main") throw new Error("Unexpected stable staging service or environment");
            if (version.version !== process.env.GITHUB_SHA) throw new Error(`Stable staging alias points at ${version.version}`);
            console.log(JSON.stringify({
              stagingUrl: `https://${process.env.STAGING_ALIAS}`,
              health: health.status,
              readiness: readiness.status,
              version: version.version,
              commitRef: version.commitRef
            }));
          '
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          GH_TOKEN: ${{ github.token }}
