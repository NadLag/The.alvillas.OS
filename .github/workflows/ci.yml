name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: alvillas_os
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d alvillas_os"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/alvillas_os?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/alvillas_os?schema=public
      POSTGRES_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres?schema=public
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/alvillas_os_shadow?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:i18n
      - run: npm run check:rtl-css
      - run: npm run check:boundaries
      - run: npm run check:organization-id
      - name: Prepare schema drift database
        run: |
          echo "CREATE DATABASE alvillas_os_shadow;" | npx prisma db execute --stdin --url "$POSTGRES_ADMIN_URL"
      - run: npm run check:schema-drift
      - run: npm run check:ledger
      - run: npm run check:audit
      - run: npm run check:progress
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  deploy-staging:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_CLI_VERSION: "63.1.2"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Vercel CLI
        run: npm install -g "vercel@${VERCEL_CLI_VERSION:?set VERCEL_CLI_VERSION}"
      - name: Pull staging environment
        run: vercel pull --yes --environment=preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Build staging
        run: vercel build
      - name: Deploy staging
        run: vercel deploy --prebuilt --target=preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
