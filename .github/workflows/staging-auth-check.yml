name: Staging authentication check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging-auth:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Require current merged main
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$GITHUB_SHA"
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm ci
      - name: Check staging token access without deployment
        run: npx tsx scripts/staging-vercel-access.ts
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
